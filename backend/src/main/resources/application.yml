server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:communityfix}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 2s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 5
        default-requeue-rejected: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 500ms
      timeout: 500ms
      repositories:
        enabled: false
  application:
    name: communityfix-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/communityfix?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USER:communityfix}
    password: ${DB_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      maximum-pool-size: 10
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
management:
  health:
    rabbit:
      enabled: ${RABBITMQ_ENABLED:false}
    redis:
      enabled: ${REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    return-instance-for-empty-row: true
communityfix:
  orders:
    auto-approve: ${ORDER_AUTO_APPROVE:true}
  billing:
    mock-enabled: ${BILLING_MOCK_ENABLED:${DEMO_ENABLED:false}}
  rabbit:
    enabled: ${RABBITMQ_ENABLED:false}
  redis:
    enabled: ${REDIS_ENABLED:false}
    namespace: ${REDIS_NAMESPACE:communityfix}
  jwt-secret: ${JWT_SECRET}
  jwt-issuer: communityfix
  jwt-audience: communityfix-client
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  bootstrap-username: ${BOOTSTRAP_USERNAME:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  demo-enabled: ${DEMO_ENABLED:false}
  demo-sync-passwords: ${DEMO_SYNC_PASSWORDS:false}
  demo-passwords:
    property: ${DEMO_PROPERTY_PASSWORD:}
    resident: ${DEMO_RESIDENT_PASSWORD:}
    worker: ${DEMO_WORKER_PASSWORD:}
  storage:
    mode: ${STORAGE_MODE:minio}
    directory: ${STORAGE_DIRECTORY:.local/uploads}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:communityfix}
  wechat:
    confirmation-template-id: ${WECHAT_CONFIRMATION_TEMPLATE_ID:0FK0JBc2x7cjS9i6N2SokPsB-FLjMZK9Ua7O9clGzx8}
    payment-template-id: ${WECHAT_PAYMENT_TEMPLATE_ID:payqWcSKkakhM-DNMteuYfjVsQFKk4wDdSYODl15uII}
    acceptance-template-id: ${WECHAT_ACCEPTANCE_TEMPLATE_ID:5Rdms3X2C7xEcXijCjWKlqxNd2RcDApD4GmHDDCGwKk}
    completion-template-id: ${WECHAT_COMPLETION_TEMPLATE_ID:cmprBc8HFLj9-w7080XZiZdhzMic8yRVzbtUstEJwkg}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    quote-template-id: ${WECHAT_QUOTE_TEMPLATE_ID:}
    quote-order-field: ${WECHAT_QUOTE_ORDER_FIELD:}
    quote-amount-field: ${WECHAT_QUOTE_AMOUNT_FIELD:}
    order-template-id: ${WECHAT_ORDER_TEMPLATE_ID:}
    order-number-field: ${WECHAT_ORDER_NUMBER_FIELD:}
    order-status-field: ${WECHAT_ORDER_STATUS_FIELD:}
  ai:
    daily-token-warning: ${AI_DAILY_TOKEN_WARNING:100000}
    provider-requests-per-minute: ${AI_PROVIDER_REQUESTS_PER_MINUTE:30}
    endpoint: ${AI_ENDPOINT:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    repair:
      max-output-tokens: ${AI_REPAIR_MAX_OUTPUT_TOKENS:128}
      endpoint: ${AI_REPAIR_ENDPOINT:}
      api-key: ${AI_REPAIR_API_KEY:}
      model: ${AI_REPAIR_MODEL:}
    support:
      max-output-tokens: ${AI_SUPPORT_MAX_OUTPUT_TOKENS:1024}
      history-characters: ${AI_SUPPORT_HISTORY_CHARACTERS:6000}
      endpoint: ${AI_SUPPORT_ENDPOINT:}
      api-key: ${AI_SUPPORT_API_KEY:}
      model: ${AI_SUPPORT_MODEL:}
    failure-threshold: ${AI_FAILURE_THRESHOLD:3}
    cooldown-seconds: ${AI_COOLDOWN_SECONDS:60}
    retention-days: ${AI_RETENTION_DAYS:30}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
