name: communityfix
services:
  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_DATABASE: communityfix
      MYSQL_USER: communityfix
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes: ["minio-data:/data"]
    restart: unless-stopped
  registry:
    build: { context: ../registry }
    environment:
      EUREKA_HOSTNAME: registry
      EUREKA_URL: http://registry:8761/eureka/
    restart: unless-stopped
  backend:
    build: { context: ../backend }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/communityfix?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
      DB_USER: communityfix
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      BOOTSTRAP_USERNAME: ${BOOTSTRAP_USERNAME:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_SYNC_PASSWORDS: ${DEMO_SYNC_PASSWORDS:-false}
      DEMO_PROPERTY_PASSWORD: ${DEMO_PROPERTY_PASSWORD:-}
      DEMO_RESIDENT_PASSWORD: ${DEMO_RESIDENT_PASSWORD:-}
      DEMO_WORKER_PASSWORD: ${DEMO_WORKER_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_ORDER_TEMPLATE_ID: ${WECHAT_ORDER_TEMPLATE_ID:-}
      WECHAT_ORDER_NUMBER_FIELD: ${WECHAT_ORDER_NUMBER_FIELD:-}
      WECHAT_ORDER_STATUS_FIELD: ${WECHAT_ORDER_STATUS_FIELD:-}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_FAILURE_THRESHOLD: ${AI_FAILURE_THRESHOLD:-3}
      AI_COOLDOWN_SECONDS: ${AI_COOLDOWN_SECONDS:-60}
      AI_RETENTION_DAYS: ${AI_RETENTION_DAYS:-30}
      EUREKA_ENABLED: "true"
      EUREKA_URL: http://registry:8761/eureka/
    depends_on:
      mysql: { condition: service_healthy }
      minio: { condition: service_started }
      registry: { condition: service_started }
    restart: unless-stopped
  gateway:
    build: { context: ../gateway }
    environment:
      EUREKA_URL: http://registry:8761/eureka/
    depends_on:
      registry: { condition: service_started }
      backend: { condition: service_started }
    restart: unless-stopped
  nginx:
    image: nginx:1.28.0-alpine
    ports: ["${WEB_PORT:-8088}:80"]
    volumes:
      - ../admin-web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [gateway]
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:
  minio-data:
