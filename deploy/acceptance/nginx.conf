server {
    listen 80;
    root /web/admin;
    client_max_body_size 50m;
    location /api/ {
        proxy_pass http://gateway:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
