server:
  port: ${GATEWAY_PORT:8081}
spring:
  application:
    name: communityfix-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: communityfix-notifications-live
              uri: lb:ws://communityfix-service
              predicates:
                - Path=/api/notifications/live
              filters:
                - PreserveHostHeader
            - id: communityfix-api
              uri: lb://communityfix-service
              predicates:
                - Path=/api/**
              filters:
                - PreserveHostHeader
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only
